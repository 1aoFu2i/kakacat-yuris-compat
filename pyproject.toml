[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kakacat-yuris-compat"
version = "0.1.0"
description = "咔咔喵（KrkrCat）YU-RIS 游戏兼容适配流程与工具"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt", "third_party/evbunpack_min/NOTICE*"]
dependencies = ["cryptography==50.0.2"]

[project.scripts]
kakacat-yuris = "kakacat_yuris.cli:main"

[tool.setuptools.packages.find]
include = ["kakacat_yuris*"]
